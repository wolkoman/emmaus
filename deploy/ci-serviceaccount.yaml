apiVersion: v1
kind: Namespace
metadata:
  name: emmaus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emmaus-ci
  namespace: emmaus
---
apiVersion: v1
kind: Secret
metadata:
  name: emmaus-ci-token
  namespace: emmaus
  annotations:
    kubernetes.io/service-account.name: emmaus-ci
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: emmaus-ci
  namespace: emmaus
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Helm v4's --wait reads child ReplicaSets and Pods to compute Deployment status
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ConfigMaps are used for Pocketbase migration files bundled into the chart
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CronJob + its Jobs for the nightly Pocketbase backup
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Helm stores release state as Secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: emmaus-ci
  namespace: emmaus
subjects:
  - kind: ServiceAccount
    name: emmaus-ci
    namespace: emmaus
roleRef:
  kind: Role
  name: emmaus-ci
  apiGroup: rbac.authorization.k8s.io
