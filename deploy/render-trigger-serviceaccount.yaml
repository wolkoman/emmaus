# Identity used by the Next.js app (Vercel) to spawn PDF render Jobs in the
# cluster. One-time bootstrap, applied manually like ci-serviceaccount.yaml:
#
#   kubectl apply -f deploy/render-trigger-serviceaccount.yaml
#
# Extract the token for the Vercel env var (K8S_RENDER_TOKEN):
#
#   kubectl get secret emmaus-render-trigger-token -n emmaus \
#     -o jsonpath='{.data.token}' | base64 -d
#
# Deliberately minimal permissions: this token can only manage batch Jobs in
# the emmaus namespace — it cannot read secrets, exec into pods, or touch
# anything else. See docs/pdf-render-jobs.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emmaus-render-trigger
  namespace: emmaus
---
apiVersion: v1
kind: Secret
metadata:
  name: emmaus-render-trigger-token
  namespace: emmaus
  annotations:
    kubernetes.io/service-account.name: emmaus-render-trigger
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: emmaus-render-trigger
  namespace: emmaus
rules:
  # create: spawn render Jobs; get/list: optional introspection/debugging;
  # delete: allow cancelling a stuck render from the app if ever needed.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: emmaus-render-trigger
  namespace: emmaus
subjects:
  - kind: ServiceAccount
    name: emmaus-render-trigger
    namespace: emmaus
roleRef:
  kind: Role
  name: emmaus-render-trigger
  apiGroup: rbac.authorization.k8s.io
