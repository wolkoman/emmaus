{{- range .Values.siteCrons.jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
spec:
  schedule: {{ .schedule | quote }}
  timeZone: {{ $.Values.siteCrons.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No retries: a half-sent digest must not go out twice; the next run catches up.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: curl
              image: alpine/curl:8.11.1
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  curl -fsS --max-time 290
                  -H "Authorization: Bearer ${CRON_SECRET}"
                  {{ printf "%s%s" $.Values.siteCrons.siteUrl .path | quote }}
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.secretName }}
                      key: CRON_SECRET
              resources:
                requests:
                  memory: "16Mi"
                  cpu: "10m"
{{- end }}
