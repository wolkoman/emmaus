<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pre-live</title>
    <style>
      @font-face {
        font-family: "Source Sans 3";
        font-weight: 400;
        src: url("/fonts/source-sans-3-latin-ext-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Source Sans 3";
        font-weight: 600;
        src: url("/fonts/source-sans-3-latin-ext-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Source Sans 3";
        font-weight: 700;
        src: url("/fonts/source-sans-3-latin-ext-700-normal.woff2") format("woff2");
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      body {
        position: relative;
        color: #fff;
        font-family: "Source Sans 3", -apple-system, "Helvetica Neue", Arial, sans-serif;
      }

      /* Must match the OBS Move transition into the Live scene: duration and easing (Cubic, In/Out). */
      :root {
        --move-ms: 800ms;
        --move-ease: cubic-bezier(0.65, 0, 0.35, 1);
      }

      /* The page sits above the camera (ATEM IN, x 688, y 96, scale 0.6), which shows through this hole. */
      .backdrop {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #1d474b 0%, #12302f 100%);
        clip-path: path(evenodd, "M0 0H1920V1080H0Z M688 96H1840V744H688Z");
        transition: clip-path var(--move-ms) var(--move-ease);
      }
      .camera {
        position: absolute;
        left: 688px;
        top: 96px;
        width: 1152px;
        height: 648px;
        box-shadow: 0 24px 60px rgb(0 0 0 / 0.35);
        transition-property: left, top, width, height, box-shadow;
        transition-duration: var(--move-ms);
        transition-timing-function: var(--move-ease);
      }

      /* The only three type sizes on this screen; --m is the smallest allowed on stream. */
      :root {
        --xl: 56px;
        --l: 40px;
        --m: 32px;
      }

      .info {
        position: absolute;
        left: 80px;
        top: 96px;
        width: 528px;
      }

      .block {
        display: flex;
        flex-direction: column;
        gap: 18px;
        font-size: var(--m);
        line-height: 1.3;
      }

      .title {
        font-size: var(--xl);
        line-height: 1.08;
        font-weight: 700;
        text-wrap: balance;
      }
      .date {
        font-size: var(--l);
        font-weight: 600;
      }

      /* Top-left corner of the camera frame, so it stays visible during the trailer without covering its subtitles. */
      .broadcast {
        position: absolute;
        left: 720px;
        top: 128px;
        padding: 12px 22px;
        border-radius: 10px;
        background: rgb(0 0 0 / 0.55);
        font-size: var(--l);
        line-height: 1.15;
        font-weight: 700;
        white-space: nowrap;
        opacity: 0;
        z-index: 1; /* above the trailer video */
      }
      .broadcast.shown {
        opacity: 1;
      }

      .info,
      .subs,
      .video,
      .broadcast,
      .parish,
      .film {
        transition:
          opacity 500ms ease,
          visibility 500ms,
          transform var(--move-ms) var(--move-ease);
      }

      /* While the trailer plays it fills the camera frame and the left column shows its translations. */
      .video {
        position: absolute;
        left: 688px;
        top: 96px;
        width: 1152px;
        height: 648px;
        background: #000;
      }
      .subs {
        position: absolute;
        left: 80px;
        top: 96px;
        width: 528px;
        display: flex;
        flex-direction: column;
        gap: 40px;
      }
      .sub-lang {
        font-size: var(--m);
        color: rgb(255 255 255 / 0.68);
      }
      .sub-text {
        margin-top: 8px;
        font-size: var(--l);
        line-height: 1.2;
        font-weight: 600;
        text-wrap: balance;
      }
      body:not(.trailer) .video,
      body:not(.trailer) .subs,
      .trailer .info {
        opacity: 0;
        visibility: hidden;
      }
      /* Before the Mass, the pause and the end each have their own left column; only the current one shows. */
      body:not(.screen-before) .info-before,
      body:not(.screen-pause) .info-pause,
      body:not(.screen-end) .info-end {
        opacity: 0;
        visibility: hidden;
      }

      .film {
        position: absolute;
        left: 688px;
        top: 792px;
        width: 1152px;
        /* The link sits beside the title so the block ends level with the parish logo. */
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px 32px;
        font-size: var(--m);
        line-height: 1.3;
      }
      .film-about {
        grid-column: 1 / -1;
      }
      .film-title {
        grid-area: 1 / 1;
        font-size: var(--l);
        line-height: 1.15;
        font-weight: 700;
      }
      .film-more {
        grid-area: 1 / 2;
        align-self: baseline;
        font-weight: 600;
        color: #ff8a44;
      }
      .parish {
        position: absolute;
        left: 80px;
        bottom: 96px;
        width: 528px;
        display: flex;
        align-items: flex-start;
        gap: 20px;
      }
      .parish img {
        width: 72px;
        height: 72px;
      }
      .parish-name {
        font-size: var(--m);
        line-height: 1.2;
        font-weight: 600;
      }
      .parish-place {
        margin-top: 4px;
        font-size: var(--m);
        color: rgb(255 255 255 / 0.68);
      }

      /* On air (OBS scene "Live") the camera fills the screen: open the hole in step and clear everything away. */
      body.on-air .backdrop {
        clip-path: path(evenodd, "M0 0H1920V1080H0Z M0 0H1920V1080H0Z");
      }
      body.on-air .camera {
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      body.on-air .info,
      body.on-air .subs,
      body.on-air .parish {
        transform: translateX(-120px);
      }
      body.on-air .film {
        transform: translateY(120px);
      }
      body.on-air :is(.info, .subs, .parish, .film, .broadcast, .video) {
        opacity: 0;
        visibility: hidden;
      }
      /* A rotating line holds every language in one cell, only one visible, so its height never changes. */
      .sized {
        display: grid;
      }
      .sized > * {
        grid-area: 1 / 1;
      }
      .sizer {
        visibility: hidden;
      }
      /* "Live picture: hide": the frame closes and the texts move into two columns over the whole screen. */
      .info,
      .broadcast,
      .film,
      .parish {
        transition-property: opacity, visibility, transform, left, top, bottom, width;
        transition-duration: 500ms, 500ms, var(--move-ms), var(--move-ms), var(--move-ms), var(--move-ms), var(--move-ms);
        transition-timing-function: ease, ease, var(--move-ease), var(--move-ease), var(--move-ease), var(--move-ease), var(--move-ease);
      }
      body.camera-hidden:not(.on-air) .backdrop {
        clip-path: path(evenodd, "M0 0H1920V1080H0Z M1264 420H1264V420H1264Z");
      }
      body.full .info {
        left: 160px;
        top: 160px;
        width: 760px;
      }
      body.full .broadcast {
        left: 1040px;
        top: 160px;
      }
      body.full .film {
        left: 1040px;
        top: 300px;
        width: 720px;
      }
      body.camera-hidden:not(.on-air) .camera {
        box-shadow: none;
      }
      body.full .film {
        grid-template-columns: 1fr;
      }
      body.full .film-title,
      body.full .film-more {
        grid-area: auto;
      }
      body.full .film-more {
        grid-row: 3;
      }
      body.full .parish {
        left: 160px;
        bottom: 120px;
      }

      /* For loading straight into a scene: take the end state without animating. */
      .instant,
      .instant * {
        transition: none !important;
      }
    </style>
  </head>
  <body class="screen-before">
    <div class="backdrop"></div>
    <div class="camera"></div>

    <!-- Text comes from [data-key]; data-lang="all" cycles through every language, otherwise English. -->
    <div class="info info-before">
      <div class="block">
        <div class="title" data-key="title" data-lang="all"></div>
        <div class="date" data-key="date" data-lang="all"></div>
        <div class="line" data-key="celebrant" data-lang="all"></div>
        <div class="line" data-key="welcome" data-lang="all"></div>
        <div class="languages" data-key="languages" data-lang="all"></div>
      </div>
    </div>

    <div class="info info-pause">
      <div class="block">
        <div class="title" data-key="pauseTitle" data-lang="all"></div>
        <div class="date" data-key="pauseTime" data-lang="all"></div>
        <div class="line" data-key="pauseMeeting" data-lang="all"></div>
        <div class="line" data-key="pauseNote" data-lang="all"></div>
      </div>
    </div>

    <div class="info info-end">
      <div class="block">
        <div class="title" data-key="endTitle" data-lang="all"></div>
        <div class="line" data-key="endRecording" data-lang="all"></div>
      </div>
    </div>

    <div class="parish">
      <img src="/logo.svg" alt="" />
      <div>
        <div class="parish-name" data-key="parish"></div>
        <div class="parish-place" data-key="place" data-lang="all"></div>
      </div>
    </div>

    <div class="broadcast"><div data-key="broadcast"></div></div>

    <video class="video" src="/media/trailer.mp4" preload="auto" playsinline></video>
    <audio class="music" src="/media/music.mp3" preload="auto" loop></audio>
    <audio class="announce" preload="auto"></audio>
    <div class="subs"></div>

    <div class="film">
      <div class="film-title" data-key="filmTitle" data-lang="all"></div>
      <div class="film-about" data-key="filmAbout" data-lang="all"></div>
      <div class="film-more" data-key="filmMore"></div>
    </div>

    <script type="module">
      import { connect } from "/overlay-client.js";
      import { morphText } from "/morph-text.js";

      const ROTATE_EVERY = 8000;
      const content = await fetch("/api/content/prelive").then((res) => res.json());
      const languages = { all: ["en", ...content.rotation] };
      let rotation = 0;
      let startTime = null;
      let resumeTime = null;
      let screen = "before";

      // --- Text ---

      function langFor(el) {
        const list = languages[el.dataset.lang];
        return list ? list[rotation % list.length] : "en";
      }

      function textFor(lang, key) {
        return key === "broadcast" ? broadcastText() : (content.text[lang][key] ?? content[key]);
      }

      // Sizers go through morphText too, so they lay out exactly like the visible text.
      const targets = new Map();
      for (const el of document.querySelectorAll("[data-key][data-lang]")) {
        const sizers = languages[el.dataset.lang].map((lang) => {
          const sizer = Object.assign(document.createElement("span"), { className: "sizer", lang });
          morphText(sizer, textFor(lang, el.dataset.key));
          return sizer;
        });
        const text = document.createElement("span");
        el.replaceChildren(...sizers, text);
        el.classList.add("sized");
        targets.set(el, text);
      }

      function render() {
        for (const el of document.querySelectorAll("[data-key]")) {
          const lang = langFor(el);
          el.lang = lang;
          morphText(targets.get(el) ?? el, textFor(lang, el.dataset.key));
        }
        document.querySelector(".broadcast").classList.toggle("shown", startTime !== null);
      }

      setInterval(() => {
        rotation += 1;
        render();
      }, ROTATE_EVERY);

      // --- Countdown ---

      /** Whole minutes until a time of day ("HH:MM") today, rounded up; 0 once it has passed. */
      function minutesLeft(time) {
        const [h, m] = time.split(":").map(Number);
        const start = new Date();
        start.setHours(h, m, 0, 0);
        return Math.max(0, Math.ceil((start - Date.now()) / 60000));
      }

      function broadcastText() {
        if (!startTime) return "";
        if (screen === "end") return content.ended;
        // The pause counts down to when the broadcast continues, the screen before the Mass to its start.
        const [time, soon, until] =
          screen === "pause"
            ? [resumeTime, content.resumingSoon, content.resumingIn]
            : [startTime, content.startingSoon, content.startingIn];
        const n = minutesLeft(time);
        if (n === 0) return soon;
        return until.replace("{minutes}", `${n} ${n === 1 ? "minute" : "minutes"}`);
      }

      setInterval(render, 1000);

      // --- Trailer ---

      const video = document.querySelector(".video");
      const subs = document.querySelector(".subs");
      for (const { lang, name } of content.trailer.languages) {
        subs.insertAdjacentHTML(
          "beforeend",
          `<div lang="${lang}"><div class="sub-lang">${name}</div><div class="sub-text" data-cue="${lang}"></div></div>`,
        );
      }

      video.ontimeupdate = () => {
        const t = video.currentTime;
        const cue = content.trailer.cues.find((c) => t >= c.start && t < c.end);
        for (const el of subs.querySelectorAll("[data-cue]")) morphText(el, cue ? cue[el.dataset.cue] : "");
      };
      video.onended = () => client.set("prelive", { trailer: "off" });

      let volumeFade;
      function setTrailer(play) {
        if (play === document.body.classList.contains("trailer")) return;
        document.body.classList.toggle("trailer", play);
        clearInterval(volumeFade);
        if (play) {
          video.volume = 1;
          video.currentTime = 0;
          video.play().catch((error) => console.warn("trailer:", error));
          return;
        }
        // Fade the sound out alongside the picture instead of cutting it.
        volumeFade = setInterval(() => {
          video.volume = Math.max(0, video.volume - 0.1);
          if (video.volume > 0) return;
          clearInterval(volumeFade);
          video.pause();
        }, 50);
      }

      // --- Music ---

      const MUSIC_FADE_MS = 1500;
      const music = document.querySelector(".music");
      let musicFade;

      /** Fades the music to a volume; at 0 it pauses and later resumes where it stopped. */
      function setMusic(target) {
        if (target === music.volume && !music.paused) return;
        if (target > 0 && music.paused) {
          music.volume = 0;
          music.play().catch((error) => console.warn("music:", error));
        }
        clearInterval(musicFade);
        const step = 50 / MUSIC_FADE_MS;
        musicFade = setInterval(() => {
          music.volume = target > music.volume ? Math.min(target, music.volume + step) : Math.max(target, music.volume - step);
          if (music.volume !== target) return;
          clearInterval(musicFade);
          if (target === 0) music.pause();
        }, 50);
      }

      // --- Announcement ---

      const ANNOUNCE_LANGS = ["de", "hr", "it", "en"];
      /** Silence between two languages. */
      const ANNOUNCE_GAP_MS = 800;
      /** Music volume under the voice. */
      const MUSIC_UNDER_VOICE = 0.2;
      const announce = document.querySelector(".announce");
      let announceIndex = -1;
      /** Each screen has its own recording (announce-before-de.mp3, announce-pause-de.mp3, ...), chosen when it starts. */
      let announceScreen;
      let announceGap;
      let announceFade;

      function playAnnounce(index) {
        announceIndex = index;
        if (index >= ANNOUNCE_LANGS.length) {
          client.set("prelive", { announce: "off" });
          return;
        }
        announce.src = `/media/announce-${announceScreen}-${ANNOUNCE_LANGS[index]}.mp3`;
        announce.volume = 1;
        announce.play().catch((error) => console.warn("announce:", error));
      }
      announce.onended = () => {
        announceGap = setTimeout(() => playAnnounce(announceIndex + 1), ANNOUNCE_GAP_MS);
      };
      // A missing language file is skipped rather than stopping the others.
      announce.onerror = () => {
        console.warn(`announce: ${announce.src} could not be played`);
        playAnnounce(announceIndex + 1);
      };

      function setAnnounce(play) {
        if (play === announceIndex >= 0) return;
        clearTimeout(announceGap);
        clearInterval(announceFade);
        if (play) {
          announceScreen = screen;
          playAnnounce(0);
          return;
        }
        announceIndex = -1;
        announceFade = setInterval(() => {
          announce.volume = Math.max(0, announce.volume - 0.1);
          if (announce.volume > 0) return;
          clearInterval(announceFade);
          announce.pause();
        }, 50);
      }

      // --- On air ---

      // The server switches OBS to the Live scene and reports it in obs.scene at the moment the transition starts.
      function setOnAir(onAir, { animate }) {
        document.body.classList.toggle("instant", !animate);
        document.body.classList.toggle("on-air", onAir);
        document.body.getBoundingClientRect(); // apply the end state before transitions return
        document.body.classList.remove("instant");
      }

      // --- State ---

      render();
      let firstState = true;
      const client = connect({
        on: {
          state: ({ state }) => {
            startTime = state.prelive.startTime;
            resumeTime = state.prelive.resumeTime;
            screen = state.prelive.screen;
            for (const name of ["before", "pause", "end"]) document.body.classList.toggle(`screen-${name}`, screen === name);
            // Without the camera the frame closes; the texts take the whole screen except while the trailer needs the frame.
            const hidden = state.prelive.camera === "hide";
            document.body.classList.toggle("camera-hidden", hidden);
            document.body.classList.toggle("full", hidden && state.prelive.trailer !== "play");
            setTrailer(state.prelive.trailer === "play");
            setAnnounce(state.prelive.announce === "play");
            const musicVolume =
              state.prelive.music !== "play" || state.prelive.trailer === "play"
                ? 0
                : state.prelive.announce === "play"
                  ? MUSIC_UNDER_VOICE
                  : 1;
            setMusic(musicVolume);
            // A page loading mid-broadcast takes the current scene without animating.
            setOnAir(state.obs.scene === "live", { animate: !firstState });
            firstState = false;
            render();
          },
        },
      });
    </script>
  </body>
</html>
