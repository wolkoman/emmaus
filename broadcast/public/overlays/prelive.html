<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pre-live</title>
    <style>
      @font-face {
        font-family: "Source Sans 3";
        font-weight: 400;
        src: url("/fonts/source-sans-3-latin-ext-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Source Sans 3";
        font-weight: 600;
        src: url("/fonts/source-sans-3-latin-ext-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Source Sans 3";
        font-weight: 700;
        src: url("/fonts/source-sans-3-latin-ext-700-normal.woff2") format("woff2");
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      body {
        position: relative;
        color: #fff;
        font-family: "Source Sans 3", -apple-system, "Helvetica Neue", Arial, sans-serif;
      }

      /* Must match the OBS Move transition into the Live scene: duration and easing (Cubic, In/Out). */
      :root {
        --move-ms: 800ms;
        --move-ease: cubic-bezier(0.65, 0, 0.35, 1);
      }

      /* The page sits above the camera (ATEM IN, x 688, y 96, scale 0.6), which shows through this hole. */
      .backdrop {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #1d474b 0%, #12302f 100%);
        clip-path: path(evenodd, "M0 0H1920V1080H0Z M688 96H1840V744H688Z");
        transition: clip-path var(--move-ms) var(--move-ease);
      }
      .camera {
        position: absolute;
        left: 688px;
        top: 96px;
        width: 1152px;
        height: 648px;
        box-shadow: 0 24px 60px rgb(0 0 0 / 0.35);
        transition-property: left, top, width, height;
        transition-duration: var(--move-ms);
        transition-timing-function: var(--move-ease);
      }

      /* The only four type sizes on this screen. */
      :root {
        --xl: 48px;
        --l: 32px;
        --m: 26px;
        --s: 22px;
      }

      .info {
        position: absolute;
        left: 80px;
        top: 96px;
        width: 528px;
      }

      .block {
        display: flex;
        flex-direction: column;
        gap: 18px;
        font-size: var(--m);
        line-height: 1.3;
      }

      .title {
        font-size: var(--xl);
        line-height: 1.08;
        font-weight: 700;
        text-wrap: balance;
      }
      .date {
        font-size: var(--l);
        font-weight: 600;
      }

      /* Top-left corner of the camera frame, so it stays visible during the trailer without covering its subtitles. */
      .broadcast {
        position: absolute;
        left: 720px;
        top: 128px;
        padding: 12px 22px;
        border-radius: 10px;
        background: rgb(0 0 0 / 0.55);
        font-size: var(--l);
        line-height: 1.15;
        font-weight: 700;
        white-space: nowrap;
        opacity: 0;
      }
      .broadcast.shown {
        opacity: 1;
      }

      .info,
      .subs,
      .video,
      .broadcast,
      .parish,
      .film {
        transition:
          opacity 500ms ease,
          visibility 500ms,
          transform var(--move-ms) var(--move-ease);
      }

      /* While the trailer plays it fills the camera frame and the left column shows its translations. */
      .video {
        position: absolute;
        left: 688px;
        top: 96px;
        width: 1152px;
        height: 648px;
        background: #000;
      }
      .subs {
        position: absolute;
        left: 80px;
        top: 96px;
        width: 528px;
        display: flex;
        flex-direction: column;
        gap: 40px;
      }
      .sub-lang {
        font-size: var(--s);
        color: rgb(255 255 255 / 0.68);
      }
      .sub-text {
        margin-top: 8px;
        font-size: var(--l);
        line-height: 1.2;
        font-weight: 600;
        text-wrap: balance;
      }
      body:not(.trailer) .video,
      body:not(.trailer) .subs,
      .trailer .info {
        opacity: 0;
        visibility: hidden;
      }

      .film {
        position: absolute;
        left: 688px;
        top: 792px;
        width: 1152px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        font-size: var(--m);
        line-height: 1.3;
      }
      .film-title {
        font-size: var(--l);
        line-height: 1.15;
        font-weight: 700;
      }
      .film-more {
        font-weight: 600;
        color: #ff8a44;
      }
      .film .alt {
        margin-top: 4px;
        font-size: var(--s);
        font-weight: 400;
      }

      .alt {
        color: rgb(255 255 255 / 0.68);
      }

      .parish {
        position: absolute;
        left: 80px;
        bottom: 96px;
        width: 528px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .parish img {
        width: 72px;
        height: 72px;
      }
      .parish-name {
        font-size: var(--m);
        line-height: 1.2;
        font-weight: 600;
      }
      .parish-place {
        margin-top: 4px;
        font-size: var(--s);
        color: rgb(255 255 255 / 0.68);
      }

      /* On air (OBS scene "Live") the camera fills the screen: open the hole in step and clear everything away. */
      body.on-air .backdrop {
        clip-path: path(evenodd, "M0 0H1920V1080H0Z M0 0H1920V1080H0Z");
      }
      body.on-air .camera {
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      body.on-air .info,
      body.on-air .subs,
      body.on-air .parish {
        transform: translateX(-120px);
      }
      body.on-air .film {
        transform: translateY(120px);
      }
      body.on-air :is(.info, .subs, .parish, .film, .broadcast, .video) {
        opacity: 0;
        visibility: hidden;
      }
      /* For loading straight into a scene: take the end state without animating. */
      .instant,
      .instant * {
        transition: none !important;
      }
    </style>
  </head>
  <body>
    <div class="backdrop"></div>
    <div class="camera"></div>

    <!-- Text comes from [data-key]; data-lang="all" cycles through every language, "alt" through all but English, otherwise English. -->
    <div class="info">
      <div class="block">
        <div class="title" data-key="title" data-lang="all"></div>
        <div class="date" data-key="date" data-lang="all"></div>
        <div class="line" data-key="celebrant" data-lang="all"></div>
        <div class="line" data-key="welcome" data-lang="all"></div>
        <div class="languages" data-key="languages" data-lang="all"></div>
      </div>
    </div>

    <div class="parish">
      <img src="/logo.svg" alt="" />
      <div>
        <div class="parish-name" data-key="parish"></div>
        <div class="parish-place" data-key="place" data-lang="all"></div>
      </div>
    </div>

    <div class="broadcast"><div data-key="broadcast"></div></div>

    <video class="video" src="/media/trailer.mp4" preload="auto" playsinline></video>
    <div class="subs"></div>

    <div class="film">
      <div class="film-title">
        <div data-key="filmTitle"></div>
        <div class="alt" data-key="filmTitle" data-lang="alt"></div>
      </div>
      <div class="film-about">
        <div data-key="filmAbout"></div>
        <div class="alt" data-key="filmAbout" data-lang="alt"></div>
      </div>
      <div class="film-more" data-key="filmMore"></div>
    </div>

    <script type="module">
      import { connect } from "/overlay-client.js";
      import { morphText } from "/morph-text.js";

      const ROTATE_EVERY = 8000;
      const content = await fetch("/api/content/prelive").then((res) => res.json());
      const languages = { all: ["en", ...content.rotation], alt: content.rotation };
      let rotation = 0;
      let startTime = null;

      // --- Text ---

      function langFor(el) {
        const list = languages[el.dataset.lang];
        return list ? list[rotation % list.length] : "en";
      }

      function textFor(lang, key) {
        return key === "broadcast" ? broadcastText() : (content.text[lang][key] ?? content[key]);
      }

      function render() {
        for (const el of document.querySelectorAll("[data-key]")) {
          const lang = langFor(el);
          el.lang = lang;
          morphText(el, textFor(lang, el.dataset.key));
        }
        document.querySelector(".broadcast").classList.toggle("shown", startTime !== null);
      }

      setInterval(() => {
        rotation += 1;
        render();
      }, ROTATE_EVERY);

      // --- Countdown ---

      /** Whole minutes until today's broadcast start, rounded up; 0 once it has passed. */
      function minutesLeft() {
        const [h, m] = startTime.split(":").map(Number);
        const start = new Date();
        start.setHours(h, m, 0, 0);
        return Math.max(0, Math.ceil((start - Date.now()) / 60000));
      }

      function broadcastText() {
        if (!startTime) return "";
        const n = minutesLeft();
        if (n === 0) return content.startingSoon;
        return content.startingIn.replace("{minutes}", `${n} ${n === 1 ? "minute" : "minutes"}`);
      }

      setInterval(render, 1000);

      // --- Trailer ---

      const video = document.querySelector(".video");
      const subs = document.querySelector(".subs");
      for (const { lang, name } of content.trailer.languages) {
        subs.insertAdjacentHTML(
          "beforeend",
          `<div lang="${lang}"><div class="sub-lang">${name}</div><div class="sub-text" data-cue="${lang}"></div></div>`,
        );
      }

      video.ontimeupdate = () => {
        const t = video.currentTime;
        const cue = content.trailer.cues.find((c) => t >= c.start && t < c.end);
        for (const el of subs.querySelectorAll("[data-cue]")) morphText(el, cue ? cue[el.dataset.cue] : "");
      };
      video.onended = () => client.set("prelive", { trailer: "off" });

      let volumeFade;
      function setTrailer(play) {
        if (play === document.body.classList.contains("trailer")) return;
        document.body.classList.toggle("trailer", play);
        clearInterval(volumeFade);
        if (play) {
          video.volume = 1;
          video.currentTime = 0;
          video.play().catch((error) => console.warn("trailer:", error));
          return;
        }
        // Fade the sound out alongside the picture instead of cutting it.
        volumeFade = setInterval(() => {
          video.volume = Math.max(0, video.volume - 0.1);
          if (video.volume > 0) return;
          clearInterval(volumeFade);
          video.pause();
        }, 50);
      }

      // --- On air ---

      // The server switches OBS to the Live scene and reports it in obs.scene at the moment the transition starts.
      function setOnAir(onAir, { animate }) {
        document.body.classList.toggle("instant", !animate);
        document.body.classList.toggle("on-air", onAir);
        document.body.getBoundingClientRect(); // apply the end state before transitions return
        document.body.classList.remove("instant");
      }

      // --- State ---

      render();
      let firstState = true;
      const client = connect({
        on: {
          state: ({ state }) => {
            startTime = state.prelive.startTime;
            setTrailer(state.prelive.trailer === "play");
            // A page loading mid-broadcast takes the current scene without animating.
            setOnAir(state.obs.scene === "live", { animate: !firstState });
            firstState = false;
            render();
          },
        },
      });
    </script>
  </body>
</html>
