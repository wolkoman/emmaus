<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Livestream control</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
        background: #16181c;
        color: #e8e8ea;
      }
      body {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      .layout {
        display: grid;
        gap: 16px;
        align-items: start;
      }
      @media (min-width: 1000px) {
        .layout {
          grid-template-columns: minmax(0, 1fr) 400px;
        }
        aside {
          position: sticky;
          top: 16px;
        }
      }
      aside {
        height: min(80vh, 720px);
        display: flex;
        flex-direction: column;
      }
      aside section {
        height: 100%;
        box-sizing: border-box;
        margin: 0;
        display: flex;
        flex-direction: column;
      }
      /* Asking cameras a question with answer buttons, in a modal opened next to Send. */
      dialog.ask {
        width: min(480px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 20px;
        border: 1px solid #3a3f46;
        border-radius: 12px;
        background: #1f2227;
        color: inherit;
      }
      dialog.ask::backdrop {
        background: rgb(0 0 0 / 0.5);
      }
      .ask form {
        display: grid;
        gap: 12px;
      }
      .ask h2 {
        margin: 0;
      }
      .ask label,
      .ask fieldset {
        display: grid;
        gap: 6px;
        margin: 0;
        padding: 0;
        border: 0;
        font-size: 14px;
        color: #9aa0a8;
      }
      .ask legend {
        padding: 0 0 6px;
      }
      .ask-error {
        margin: 0;
        min-height: 18px;
        font-size: 13px;
        color: #ffb4b9;
      }
      .ask-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .ask-actions .primary {
        background: #1f3b5a;
        border-color: #3d6fa3;
      }
      .ask-to {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .ask-to button {
        padding: 6px 10px;
        font-size: 13px;
      }
      .ask-to button[aria-pressed="true"] {
        background: #1f3b5a;
        border-color: #3d6fa3;
      }
      aside h2 {
        margin-bottom: 12px;
      }
      #chat {
        flex: 1;
        min-height: 0;
      }
      h1 {
        font-size: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .status {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #d33;
      }
      .status.connected {
        background: #3c6;
      }
      section {
        background: #1f2227;
        border: 1px solid #2c3036;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      a {
        color: #8ab4ff;
      }
      .field {
        margin-top: 14px;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 6px;
      }
      .buttons code {
        flex-basis: 100%;
      }
      button {
        font: inherit;
        font-size: 15px;
        padding: 10px 18px;
        border-radius: 8px;
        border: 1px solid #3a3f46;
        background: #2a2e34;
        color: inherit;
        cursor: pointer;
      }
      input {
        flex: 1;
        font: inherit;
        font-size: 15px;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #3a3f46;
        background: #16181c;
        color: inherit;
      }
      button.active {
        background: #e3172d;
        border-color: #e3172d;
        color: #fff;
      }
      .error {
        margin: 0 0 16px;
        padding: 10px 14px;
        border-radius: 8px;
        background: #4a1d22;
        color: #ffd7da;
        opacity: 0;
        transition: opacity 300ms ease;
      }
      .error.shown {
        opacity: 1;
      }
      code {
        display: block;
        font-size: 12px;
        color: #9aa0a8;
        margin-top: 4px;
        word-break: break-all;
      }
      /* Following a reading: the line being read and the next one, big enough to read along. */
      .reading-lines {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }
      .reading-cue {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        align-items: baseline;
        padding: 12px 14px;
        border-radius: 8px;
        background: #16181c;
      }
      .reading-cue h3 {
        grid-column: 1 / -1;
        margin: 0 0 4px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #9aa0a8;
      }
      .reading-cue .lang {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        color: #9aa0a8;
      }
      .reading-now {
        font-size: 17px;
        color: #9aa0a8;
      }
      .reading-next {
        font-size: 24px;
        border: 1px solid #3d6fa3;
      }
      .reading .buttons button {
        flex: 1;
        padding: 16px;
        font-size: 18px;
      }
      .reading .buttons .primary {
        flex: 3;
        background: #1f3b5a;
        border-color: #3d6fa3;
      }
      .reading-hint {
        margin: 8px 0 0;
        font-size: 13px;
        color: #9aa0a8;
      }
      /* Test mode: the whole page turns blue, so nobody takes the test texts for the real Mass. */
      :root {
        transition: background 300ms ease;
      }
      :root.test-mode {
        background: #0d2a57;
      }
      .test-mode section {
        background: #123a73;
        border-color: #2b5ca8;
      }
      .test-mode input,
      .test-mode .reading-cue {
        background: #0d2a57;
      }
      /* Deliberately tiny, so the live readings are not swapped by a stray tap. */
      .set-toggle {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-left: auto;
        font-size: 11px;
        font-weight: 400;
        color: #9aa0a8;
      }
      .set-toggle button {
        padding: 2px 6px;
        font-size: 11px;
        border-radius: 4px;
      }
      .set-toggle button[data-set="test"].active {
        background: #2f7de1;
        border-color: #2f7de1;
      }
    </style>
  </head>
  <body>
    <h1><span class="status"></span> Livestream control</h1>
    <p class="error" role="alert"></p>
    <div class="layout">
      <main></main>
      <aside>
        <section>
          <h2>Chat</h2>
          <div id="chat"></div>
        </section>
      </aside>
    </div>

    <dialog class="ask">
      <form method="dialog">
        <h2>Ask cameras</h2>
        <label>
          Question
          <input name="text" maxlength="500" placeholder="e.g. Ready to start?" required autofocus />
        </label>
        <fieldset>
          <legend>Who should answer</legend>
          <div class="ask-to"></div>
        </fieldset>
        <label>
          Answer buttons, separated by commas
          <input name="options" value="Yes, No" />
        </label>
        <p class="ask-error" role="alert"></p>
        <div class="ask-actions">
          <button type="button" value="cancel" class="ask-cancel">Cancel</button>
          <button class="primary">Ask</button>
        </div>
      </form>
    </dialog>

    <script type="module">
      import { connect } from "/overlay-client.js";
      import { mountChat } from "/chat.js";

      const main = document.querySelector("main");
      const { schema, overlays } = await fetch("/api/state").then((res) => res.json());
      const updaters = []; // (state) => void, one per field
      let state = null;

      const client = connect({
        client: "director",
        onStatus: (connected) => document.querySelector(".status").classList.toggle("connected", connected),
        on: {
          state: (message) => {
            state = message.state;
            updaters.forEach((update) => update(state));
            chat.refresh();
          },
          error: ({ error }) => showError(error),
          chatHistory: ({ messages }) => chat.setMessages(messages),
          chatMessage: ({ message }) => chat.add(message),
          chatUpdate: ({ message }) => chat.update(message),
          typing: ({ clients }) => chat.setTyping(clients),
        },
      });

      const askButton = Object.assign(document.createElement("button"), { type: "button", textContent: "Ask" });

      const chat = mountChat(document.querySelector("#chat"), {
        me: "director",
        actions: [askButton],
        clients: () => ["director", ...Object.keys(schema.cameras)],
        connection: client,
        aliasOf: (id) => state?.cameras[id] ?? "",
      });

      // --- Ask: a question to some cameras, answered with one tap on their phones ---

      const askDialog = document.querySelector("dialog.ask");
      const ask = askDialog.querySelector("form");
      askButton.onclick = () => {
        askDialog.querySelector(".ask-error").textContent = "";
        askDialog.showModal();
      };
      askDialog.querySelector(".ask-cancel").onclick = () => askDialog.close();

      const recipients = Object.keys(schema.cameras).map((cam) => {
        const button = Object.assign(document.createElement("button"), { type: "button" });
        button.dataset.cam = cam;
        button.setAttribute("aria-pressed", "false");
        button.onclick = () => button.setAttribute("aria-pressed", button.getAttribute("aria-pressed") !== "true");
        return button;
      });
      ask.querySelector(".ask-to").append(...recipients);
      updaters.push((current) => {
        for (const button of recipients) {
          const alias = current.cameras[button.dataset.cam];
          button.textContent = alias ? `${alias} (${button.dataset.cam})` : button.dataset.cam;
        }
      });

      // Recipients and answers stay as they were for the next question; only the question is cleared.
      ask.onsubmit = (event) => {
        event.preventDefault();
        const to = recipients.filter((b) => b.getAttribute("aria-pressed") === "true").map((b) => b.dataset.cam);
        if (to.length === 0) return (askDialog.querySelector(".ask-error").textContent = "Choose who should answer");
        const options = ask.elements.options.value.split(",").map((option) => option.trim()).filter(Boolean);
        client.ask(ask.elements.text.value, to, options);
        ask.elements.text.value = "";
        askDialog.close();
      };

      let errorTimer;
      function showError(error) {
        const el = document.querySelector(".error");
        el.textContent = error;
        el.classList.add("shown");
        clearTimeout(errorTimer);
        errorTimer = setTimeout(() => el.classList.remove("shown"), 6000);
      }

      // --- One renderer per field kind; each returns its element and a state updater. ---

      function choiceField(section, name, field) {
        if (field.readOnly) {
          const value = document.createElement("strong");
          return { el: value, update: (current) => (value.textContent = current) };
        }
        const buttons = field.values.map((value) => {
          const button = document.createElement("button");
          button.textContent = value;
          button.onclick = () => client.set(section, { [name]: value });
          return button;
        });
        const row = document.createElement("div");
        row.className = "buttons";
        row.append(...buttons, ...field.values.map((value) => apiUrl(section, name, value)));
        return {
          el: row,
          update: (current) => {
            if (!field.action) buttons.forEach((b, i) => b.classList.toggle("active", field.values[i] === current));
          },
        };
      }

      function timeField(section, name, field) {
        const form = document.createElement("form");
        form.className = "buttons";
        const input = Object.assign(document.createElement("input"), { type: "time" });
        const button = Object.assign(document.createElement("button"), { textContent: "Set" });
        form.onsubmit = (event) => {
          event.preventDefault();
          client.set(section, { [name]: input.value });
          input.blur();
        };
        form.append(input, button, apiUrl(section, name, field.initial));
        return {
          el: form,
          update: (current) => {
            if (document.activeElement !== input) input.value = current;
          },
        };
      }

      function textField(section, name, field) {
        const form = document.createElement("form");
        form.className = "buttons";
        const input = Object.assign(document.createElement("input"), { maxLength: field.maxLength, placeholder: "Name" });
        const button = Object.assign(document.createElement("button"), { textContent: "Set" });
        form.onsubmit = (event) => {
          event.preventDefault();
          client.set(section, { [name]: input.value.trim() });
          input.blur();
        };
        form.append(input, button);
        return {
          el: form,
          update: (current) => {
            if (document.activeElement !== input) input.value = current;
          },
        };
      }

      const renderers = { choice: choiceField, time: timeField, text: textField };

      /** The URL that sets this value, e.g. for a Stream Deck button. */
      function apiUrl(section, name, value) {
        return Object.assign(document.createElement("code"), {
          textContent: `${location.origin}/api/${section}/set?${name}=${value}`,
        });
      }

      // --- Page ---

      for (const [section, fields] of Object.entries(schema)) {
        if (section === "readings") continue; // the big switch at the top
        const el = document.createElement("section");
        el.innerHTML = `<h2>${section}</h2>`;
        if (overlays.includes(section)) {
          const url = `${location.origin}/overlay/${section}`;
          el.insertAdjacentHTML("beforeend", `<a href="${url}" target="_blank">${url}</a>`);
        }
        if (section === "cameras") {
          const links = Object.keys(fields).map((cam) => `<a href="/camera/${cam.slice(3)}" target="_blank">${cam}</a>`);
          el.insertAdjacentHTML("beforeend", `<div>Camera pages: ${links.join(" · ")}</div>`);
        }
        for (const [name, field] of Object.entries(fields)) {
          const { el: control, update } = renderers[field.kind](section, name, field);
          const fieldEl = document.createElement("div");
          fieldEl.className = "field";
          fieldEl.append(name, " ", control);
          el.append(fieldEl);
          updaters.push((state) => update(state[section][name]));
        }
        main.append(el);
      }

      // --- Reading: follow the reader and step the subtitles ---

      const { langs, readings, sets } = await fetch("/api/content/readings").then((res) => res.json());
      const reading = document.createElement("section");
      reading.className = "reading";
      reading.hidden = true;
      reading.innerHTML = `
        <h2>Reading: <span class="reading-where"></span></h2>
        <div class="reading-lines"></div>
        <div class="buttons">
          <button class="reading-prev">◀ Back</button>
          <button class="primary reading-next-button">Next line ▶</button>
        </div>
        <p class="reading-hint">Press "Next line" (or → / Page Down, e.g. on a presenter clicker) as the reader starts the line in the blue box. ← / Page Up goes back.</p>`;
      reading.querySelector(".reading-prev").onclick = () => client.set("live", { step: "prev" });
      reading.querySelector(".reading-next-button").onclick = () => client.set("live", { step: "next" });
      main.prepend(reading);

      function cueBlock(title, className, texts) {
        const block = document.createElement("div");
        block.className = `reading-cue ${className}`;
        block.append(Object.assign(document.createElement("h3"), { textContent: title }));
        for (const lang of langs) {
          block.append(
            Object.assign(document.createElement("span"), { className: "lang", textContent: lang }),
            Object.assign(document.createElement("span"), { textContent: texts?.[lang] ?? "–" }),
          );
        }
        return block;
      }

      updaters.push((state) => {
        const { reading: which, cue } = state.live;
        reading.hidden = which === "off";
        if (reading.hidden) return;
        const name = sets[state.readings.set][which];
        // Step 0 is the Bible reference alone; the lines follow from the announcement on.
        const { label, reference, cues } = readings[name];
        const steps = [Object.fromEntries(langs.map((lang) => [lang, `${label[lang]} · ${reference[lang]}`])), ...cues];
        const index = Number(cue);
        const where = index === 0 ? "Bible reference" : `line ${index} of ${steps.length - 1}`;
        reading.querySelector(".reading-where").textContent = `${name}, ${where}`;
        reading.querySelector(".reading-lines").replaceChildren(
          cueBlock(index === 0 ? "On screen: the Bible reference" : "Being read", "reading-now", steps[index]),
          cueBlock(index + 1 < steps.length ? "Next: press when this starts" : "Next: ends the subtitles", "reading-next", steps[index + 1]),
        );
      });
      if (state) updaters.at(-1)(state); // the state may have arrived while the readings loaded

      // --- Real or test readings: a big switch at the top ---

      const toggle = document.createElement("div");
      toggle.className = "set-toggle";
      const titles = { actual: "Mass", test: "Test" };
      const setButtons = Object.entries(sets).map(([set, { first, gospel }]) => {
        const button = Object.assign(document.createElement("button"), {
          type: "button",
          textContent: titles[set] ?? set,
          title: `${readings[first].reference.de} · ${readings[gospel].reference.de}; switching turns off a reading on screen`,
        });
        button.dataset.set = set;
        button.onclick = () => client.set("readings", { set });
        return button;
      });
      toggle.append("Readings:", ...setButtons);
      document.querySelector("h1").append(toggle);

      updaters.push((state) => {
        const { set } = state.readings;
        document.documentElement.classList.toggle("test-mode", set === "test");
        for (const button of setButtons) button.classList.toggle("active", button.dataset.set === set);
      });
      if (state) updaters.at(-1)(state);

      document.addEventListener("keydown", (event) => {
        if (!state || state.live.reading === "off") return;
        if (event.target instanceof Element && event.target.closest("input, textarea, dialog, [contenteditable]")) return;
        const step = { ArrowRight: "next", PageDown: "next", ArrowLeft: "prev", PageUp: "prev" }[event.key];
        if (!step) return;
        event.preventDefault();
        client.set("live", { step });
      });
    </script>
  </body>
</html>
