name: Mail Lists

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  update-lists:
    runs-on: ubuntu-latest
    steps:
      - name: Update mailbox lists from new mails
        run: |
          curl -f -sS -L --max-redirs 0 -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL }}/api/cron/mail-lists"
